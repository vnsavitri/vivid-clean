name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint and check formatting
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise the CLI
        run: vivid-clean --version
      - name: Check pinned upstream service contract
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/guillaumemeyer/watermarks-remover.git vendor/watermarks-remover
          git -C vendor/watermarks-remover fetch --depth 1 origin 104aacd212d7a262c32bd7f1f4aa380c26a5d4b5
          git -C vendor/watermarks-remover checkout --detach FETCH_HEAD
          test "$(git -C vendor/watermarks-remover rev-parse HEAD)" = "104aacd212d7a262c32bd7f1f4aa380c26a5d4b5"
          python vendor/watermarks-remover/service/scripts/server.py --host 127.0.0.1 --port 18765 &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18765/health") as response:
                      if json.load(response).get("ok"):
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("service didn't become ready")
          PY
          WATERMARKS_SERVICE_URL=http://127.0.0.1:18765 python -m unittest tests.test_live_service -v
          python - <<'PY'
          from pathlib import Path
          from vivid_clean.workflow import WATERMARKS_REMOVER_REF, managed_watermarks_client

          with managed_watermarks_client(Path.cwd()) as (client, identity):
              assert client.health()["ok"] is True
              assert identity["ref"] == WATERMARKS_REMOVER_REF
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/vivid-clean-wheel-test
          /tmp/vivid-clean-wheel-test/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/vivid-clean-wheel-test/bin/vivid-clean --version
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$(/tmp/vivid-clean-wheel-test/bin/vivid-clean --version)" = "vivid-clean ${expected_version}"
          VIVID_CLEAN_USER_HOME=/tmp/vivid-clean-user \
            VIVID_CLEAN_DATA_HOME=/tmp/vivid-clean-data \
            CODEX_HOME=/tmp/vivid-clean-codex \
            /tmp/vivid-clean-wheel-test/bin/vivid-clean setup --skills-only
          test -f /tmp/vivid-clean-user/.agents/skills/vivid-clean/SKILL.md
          test -f /tmp/vivid-clean-codex/skills/vivid-clean/SKILL.md
          VIVID_CLEAN_USER_HOME=/tmp/vivid-clean-user \
            VIVID_CLEAN_DATA_HOME=/tmp/vivid-clean-data \
            CODEX_HOME=/tmp/vivid-clean-codex \
            /tmp/vivid-clean-wheel-test/bin/vivid-clean setup --no-anthropies
          VIVID_CLEAN_DATA_HOME=/tmp/vivid-clean-data \
            /tmp/vivid-clean-wheel-test/bin/vivid-clean doctor
