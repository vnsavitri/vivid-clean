[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vivid-clean"
version = "0.3.0"
description = "A local-first AI watermark and document metadata cleaner with scoped verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vivid Savitri"}]
keywords = [
    "accessibility",
    "ai-provenance",
    "ai-watermarking",
    "c2pa",
    "document-cleaning",
    "document-metadata",
    "docx",
    "exif",
    "local-first",
    "metadata-removal",
    "pptx",
    "privacy",
    "text-watermark",
    "xmp",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vnsavitri/vivid-clean"
Documentation = "https://github.com/vnsavitri/vivid-clean#readme"
Issues = "https://github.com/vnsavitri/vivid-clean/issues"
Changelog = "https://github.com/vnsavitri/vivid-clean/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[project.scripts]
vivid-clean = "vivid_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vivid-clean" = ["SKILL.md", "PROMPT.md"]

[tool.ruff]
target-version = "py311"
